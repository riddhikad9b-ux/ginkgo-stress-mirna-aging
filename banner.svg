<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f12"/><stop offset="0.6" stop-color="#13341f"/><stop offset="1" stop-color="#1c4a2b"/>
    </linearGradient>
    <style>
      .t1 { fill: #eafff0; font-size: 33px; font-weight: 700; }
      .t2 { fill: #f2d16b; font-size: 18px; font-weight: 500; }
      .t3 { fill: #9fc4a4; font-size: 14px; letter-spacing: 1.5px; }
      .tag { fill: #0a1f12; font-size: 13px; font-weight: 700; }
      .ax { fill: #9fc4a4; font-size: 12px; }
      .sway { transform-origin: 1080px 250px; animation: sw 5s ease-in-out infinite; }
      @keyframes sw { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
      .shield { animation: pu 4s ease-in-out infinite; }
      @keyframes pu { 0%,100% { opacity: .4; } 50% { opacity: .9; } }
      .drop { stroke-dasharray: 300; stroke-dashoffset: 300; animation: dr 3.5s ease-out forwards infinite; }
      @keyframes dr { 0% { stroke-dashoffset: 300; } 60%,100% { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g fill="none" stroke="#9fc4a4" opacity="0.08">
    <circle cx="80" cy="300" r="70"/><circle cx="80" cy="300" r="115"/><circle cx="80" cy="300" r="160"/><circle cx="80" cy="300" r="205"/>
  </g>
  <text x="48" y="86" class="t3">EXTREMOSCAN · REAL-DATA REBUILD · GINKGO CAMBIUM</text>
  <text x="48" y="132" class="t1">Stress-defense miRNAs vs tree age</text>
  <text x="48" y="168" class="t2">Do centenarian Ginkgo shift their stress microRNAs?</text>
  <g transform="translate(48,198)">
    <rect width="176" height="30" rx="15" fill="#f2d16b"/><text x="88" y="20" text-anchor="middle" class="tag">20 · 200 · 600 yr trees</text>
    <rect x="188" width="180" height="30" rx="15" fill="#9fe0a8"/><text x="278" y="20" text-anchor="middle" class="tag">10 stress miRNA families</text>
    <rect x="380" width="176" height="30" rx="15" fill="#9bd0ff"/><text x="468" y="20" text-anchor="middle" class="tag">miR397 control check</text>
  </g>
  <g transform="translate(640,62)">
    <rect width="300" height="180" rx="12" fill="#fff" fill-opacity="0.04" stroke="#9fc4a4" stroke-opacity="0.3"/>
    <line x1="40" y1="145" x2="300" y2="145" stroke="#9fc4a4"/><line x1="40" y1="25" x2="40" y2="145" stroke="#9fc4a4"/>
    <polyline class="drop" points="70,42 170,92 270,126" fill="none" stroke="#f4a582" stroke-width="3"/>
    <circle cx="70" cy="42" r="6" fill="#f4a582"/><circle cx="170" cy="92" r="6" fill="#f4a582"/><circle cx="270" cy="126" r="6" fill="#f4a582"/>
    <text x="70" y="165" text-anchor="middle" class="ax">20y</text><text x="170" y="165" text-anchor="middle" class="ax">200y</text><text x="270" y="165" text-anchor="middle" class="ax">600y</text>
    <text x="300" y="20" text-anchor="end" class="ax" style="fill:#f4a582">example: miR397 control</text>
  </g>
  <g class="sway">
    <path d="M1080,250 L1080,172" stroke="#c9a94a" stroke-width="4" stroke-linecap="round"/>
    <path d="M1080,177 C1030,162 1000,112 1010,72 C1040,87 1065,82 1080,64 C1095,82 1120,87 1150,72 C1160,112 1130,162 1080,177 Z" fill="#f2d16b" opacity="0.92"/>
    <path d="M1080,174 L1080,72" stroke="#c9a94a" stroke-width="2" opacity="0.6"/>
  </g>
  <g class="shield" transform="translate(1080,120)">
    <path d="M0,-30 L26,-20 L26,6 C26,24 0,34 0,34 C0,34 -26,24 -26,6 L-26,-20 Z" fill="none" stroke="#9fe0a8" stroke-width="2.5"/>
    <path d="M-9,2 L-2,11 L11,-8" fill="none" stroke="#9fe0a8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
